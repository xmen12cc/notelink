<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteLink</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234b5ac9'/%3E%3Cpath d='M8 5.5h6l3 3V17a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 17V7a1.5 1.5 0 0 1 1-1.4z' fill='white'/%3E%3Cpath d='M9.5 12h5M9.5 14.5h3.5' stroke='%234b5ac9' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f3f9;
    --surface: #ffffff;
    --text: #1b1b21;
    --muted: #6f6e7a;
    --border: #e5e3ee;
    --accent: #4b5ac9;
    --accent-contrast: #ffffff;
    --accent-soft: #e8eafc;
    --danger: #c0344b;
    --shadow: 0 1px 2px rgba(25, 25, 50, .07), 0 10px 28px rgba(25, 25, 50, .07);
    --radius: 14px;
    --n-default: #edeaf5;
    --n-yellow: #f7e8a6;
    --n-green: #cde8c6;
    --n-blue: #c9e0f8;
    --n-pink: #f6cfdc;
    --n-gray: #e4e2db;
  }
  [data-theme="dark"] {
    --bg: #121217;
    --surface: #1c1c23;
    --text: #e5e2ea;
    --muted: #9b99a6;
    --border: #2b2b34;
    --accent: #bac3ff;
    --accent-contrast: #1c2470;
    --accent-soft: #262d4d;
    --danger: #ef7288;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 28px rgba(0, 0, 0, .38);
    --n-default: #2a2930;
    --n-yellow: #453b18;
    --n-green: #2b4026;
    --n-blue: #21344a;
    --n-pink: #4a2833;
    --n-gray: #343430;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .25s, color .25s;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px clamp(16px, 4vw, 36px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
  .brand svg { display: block; }
  .search {
    flex: 1; max-width: 520px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 16px; transition: box-shadow .15s, border-color .15s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .search svg { flex: none; color: var(--muted); }
  .search input { flex: 1; border: 0; outline: 0; background: none; color: inherit; font-size: 14.5px; }
  .spacer { flex: 1; }
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 11px; color: var(--muted);
    transition: background .15s, color .15s;
  }
  .iconbtn:hover { background: var(--accent-soft); color: var(--accent); }
  .newbtn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent); color: var(--accent-contrast);
    font-weight: 600; font-size: 14px;
    padding: 9px 16px; border-radius: 11px;
    box-shadow: var(--shadow);
    transition: transform .12s, filter .15s;
  }
  .newbtn:hover { filter: brightness(1.07); }
  .newbtn:active { transform: scale(.97); }

  /* ---------- board ---------- */
  main { padding: 22px clamp(16px, 4vw, 36px) 90px; }
  .board { columns: 240px 4; column-gap: 14px; }
  .note {
    break-inside: avoid; margin: 0 0 14px;
    background: var(--note, var(--n-default));
    border-radius: var(--radius);
    padding: 14px 16px 12px;
    box-shadow: 0 1px 2px rgba(20, 20, 45, .10);
    cursor: pointer;
    transition: transform .14s, box-shadow .14s;
    position: relative;
  }
  [data-theme="dark"] .note { box-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .note:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .note h3 {
    margin: 0 0 6px; font-size: 15px; font-weight: 650; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 7px; word-break: break-word;
  }
  .note .body {
    margin: 0; font-size: 13.2px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 10; -webkit-box-orient: vertical; overflow: hidden;
    opacity: .82;
  }
  .note footer {
    display: flex; align-items: center; gap: 6px;
    margin-top: 10px; font-size: 11.5px; opacity: .55;
  }
  .note footer svg { flex: none; }
  .note .untitled { opacity: .6; font-style: italic; }

  /* ---------- empty ---------- */
  .empty {
    max-width: 420px; margin: 12vh auto 0; text-align: center; color: var(--muted);
  }
  .empty svg { margin-bottom: 14px; opacity: .5; }
  .empty h2 { margin: 0 0 6px; color: var(--text); font-size: 20px; }
  .empty p { margin: 0; font-size: 14px; line-height: 1.55; }

  /* ---------- editor drawer ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(12, 12, 24, .38);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
    width: min(460px, 100vw);
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transform: translateX(102%);
    transition: transform .24s cubic-bezier(.3, .8, .3, 1);
    box-shadow: -18px 0 50px rgba(15, 15, 35, .18);
  }
  .drawer.open { transform: translateX(0); }
  .drawer .topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--muted);
  }
  .drawer .topbar .meta { font-size: 12.5px; margin-right: auto; padding-left: 6px; }
  .drawer .fields { flex: 1; display: flex; flex-direction: column; padding: 6px 22px 10px; overflow: hidden; }
  .drawer input.title {
    border: 0; outline: 0; background: none; color: inherit;
    font-size: 22px; font-weight: 700; letter-spacing: -.02em;
    padding: 12px 0 4px;
  }
  .drawer textarea.body {
    flex: 1; border: 0; outline: 0; background: none; color: inherit; resize: none;
    font: inherit; font-size: 14.5px; line-height: 1.6; padding: 8px 0 14px;
  }
  .drawer .banner {
    display: none; margin: 0 0 6px; padding: 9px 12px; border-radius: 10px;
    background: color-mix(in srgb, #e8a13c 22%, transparent);
    color: #8a5a12; font-size: 13px;
  }
  [data-theme="dark"] .drawer .banner { color: #f2c37c; }
  .drawer .banner.show { display: block; }
  .drawer .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-top: 1px solid var(--border);
  }
  .dot {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    background: var(--n-default); border: 2px solid transparent;
    outline: 2px solid transparent; outline-offset: 2px;
    transition: outline-color .12s, transform .12s;
  }
  .dot:hover { transform: scale(1.12); }
  .dot.active { outline-color: var(--accent); }
  .drawer .toolbar .save-state { margin-left: auto; font-size: 12px; color: var(--muted); }
  .delbtn { color: var(--muted); }
  .delbtn:hover { color: var(--danger); }

  /* ---------- status chip / toasts ---------- */
  .chip {
    position: fixed; right: 18px; bottom: 18px; z-index: 30;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 15px;
    font-size: 12.5px; color: var(--muted);
    box-shadow: var(--shadow); cursor: pointer;
  }
  .chip .led { width: 8px; height: 8px; border-radius: 50%; background: #3fa964; }
  .chip.err .led { background: var(--danger); }
  .toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 10px 16px;
    font-size: 13.5px; box-shadow: var(--shadow);
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px); } }

  @media (max-width: 560px) {
    .brand span { display: none; }
    .newbtn span { display: none; }
    .newbtn { padding: 9px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="var(--accent)"/><path d="M8 5.5h6l3 3V17a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 17V7a1.5 1.5 0 0 1 1-1.4z" fill="var(--accent-contrast)"/><path d="M9.5 12h5M9.5 14.5h3.5" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span>NoteLink</span>
  </div>
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
    <input id="search" type="search" placeholder="Search notes…" autocomplete="off">
  </label>
  <div class="spacer"></div>
  <button class="iconbtn" id="themeBtn" title="Toggle theme">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
  <button class="newbtn" id="newBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span>New note</span>
  </button>
</header>

<main>
  <div class="board" id="board"></div>
  <div class="empty" id="empty" style="display:none">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9.5 13h5M9.5 16.5h3"/></svg>
    <h2 id="emptyTitle">No notes yet</h2>
    <p id="emptyText">Create your first note with the button up top — it appears on your phone at the next sync.</p>
  </div>
</main>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="topbar">
    <button class="iconbtn" id="closeBtn" title="Close (Esc)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
    <div class="meta" id="editMeta"></div>
    <button class="iconbtn delbtn" id="deleteBtn" title="Delete note">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    </button>
  </div>
  <div class="fields">
    <div class="banner" id="staleBanner">This note changed on another device. <a href="#" id="reloadLink">Reload</a></div>
    <input class="title" id="editTitle" placeholder="Title" autocomplete="off">
    <textarea class="body" id="editBody" placeholder="Start typing…"></textarea>
  </div>
  <div class="toolbar">
    <div id="colorDots" style="display:flex; gap:8px;"></div>
    <button class="iconbtn" id="pinBtn" title="Pin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l1 7 2.5 2.5a1 1 0 0 1-.7 1.7H6.2a1 1 0 0 1-.7-1.7L8 10z"/></svg>
    </button>
    <div class="save-state" id="saveState"></div>
  </div>
</aside>

<div class="chip" id="chip" title="Sync now"><div class="led"></div><span id="chipText">Connecting…</span></div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const state = {
  notes: [],
  query: "",
  status: {},
  editing: null,      // working copy while the drawer is open
  saving: false,
  saveTimer: null,
  stale: false,
};

const NOTE_COLORS = ["default", "yellow", "green", "blue", "pink", "gray"];

/* ---------- helpers ---------- */

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function relTime(ms) {
  if (!ms) return "";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 7 * 86400) return Math.floor(s / 86400) + "d ago";
  return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function clockTime(t) {
  return new Date(t * 1000).toLocaleTimeString();
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

/* ---------- data ---------- */

async function load() {
  try {
    const data = await api("/api/notes");
    state.notes = data.notes;
    state.status = data.status;
    renderBoard();
    renderChip();
    reconcileEditor();
  } catch (e) {
    $("chipText").textContent = "Hub offline";
    $("chip").classList.add("err");
  }
}

async function syncNow() {
  try {
    state.status = await api("/api/sync", { method: "POST" });
    renderChip();
    await load();
  } catch (e) {
    toast("Sync failed: " + e.message);
  }
}

/* ---------- board ---------- */

function visibleNotes() {
  const q = state.query.trim().toLowerCase();
  if (!q) return state.notes;
  return state.notes.filter((n) =>
    n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));
}

function renderBoard() {
  const notes = visibleNotes();
  const board = $("board");
  board.innerHTML = notes.map((n) => `
    <article class="note" data-id="${esc(n.id)}" style="--note: var(--n-${esc(n.color || "default")})">
      <h3>${n.pinned ? PIN_SVG : ""}<span class="${n.title ? "" : "untitled"}">${esc(n.title || "Untitled")}</span></h3>
      ${n.body ? `<p class="body">${esc(n.body)}</p>` : ""}
      <footer>${esc(relTime(n.updated))}</footer>
    </article>`).join("");
  board.querySelectorAll(".note").forEach((el) => {
    el.addEventListener("click", () => {
      const note = state.notes.find((n) => n.id === el.dataset.id);
      if (note) openEditor({ ...note });
    });
  });
  const none = notes.length === 0;
  $("empty").style.display = none ? "block" : "none";
  if (none) {
    $("emptyTitle").textContent = state.query ? "No matching notes" : "No notes yet";
    $("emptyText").textContent = state.query
      ? "Try a different search."
      : "Create your first note with the button up top — it appears on your phone at the next sync.";
  }
}

const PIN_SVG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l1 7 2.5 2.5a1 1 0 0 1-.7 1.7H6.2a1 1 0 0 1-.7-1.7L8 10z"/></svg>`;

/* ---------- editor ---------- */

function openEditor(note) {
  state.editing = { ...note };
  state.stale = false;
  $("editTitle").value = note.title;
  $("editBody").value = note.body;
  renderEditorChrome();
  $("overlay").classList.add("open");
  $("drawer").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  setTimeout(() => $("editTitle").focus(), 240);
}

function renderEditorChrome() {
  const n = state.editing;
  if (!n) return;
  $("editMeta").textContent = "Edited " + relTime(n.updated);
  $("pinBtn").style.color = n.pinned ? "var(--accent)" : "";
  $("pinBtn").querySelector("svg").setAttribute("fill", n.pinned ? "currentColor" : "none");
  $("staleBanner").classList.toggle("show", state.stale);
  $("colorDots").innerHTML = NOTE_COLORS.map((c) =>
    `<div class="dot ${n.color === c ? "active" : ""}" data-c="${c}" title="${c}" style="--note: var(--n-${c}); background: var(--n-${c})"></div>`).join("");
  $("colorDots").querySelectorAll(".dot").forEach((el) => {
    el.addEventListener("click", () => {
      state.editing.color = el.dataset.c;
      renderEditorChrome();
      scheduleSave();
    });
  });
}

function closeEditor(saveFirst = true) {
  if (!state.editing) return;
  if (saveFirst && state.stale === false) saveNow();
  state.editing = null;
  $("overlay").classList.remove("open");
  $("drawer").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
  $("saveState").textContent = "";
}

function scheduleSave() {
  $("saveState").textContent = "…";
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(saveNow, 800);
}

function draftChanged() {
  const n = state.editing;
  if (!n) return false;
  return $("editTitle").value !== n.title || $("editBody").value !== n.body;
}

async function saveNow() {
  const n = state.editing;
  if (!n) return;
  n.title = $("editTitle").value;
  n.body = $("editBody").value;
  $("saveState").textContent = "Saving…";
  state.saving = true;
  try {
    const saved = await api(`/api/notes/${encodeURIComponent(n.id)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: n.title, body: n.body, pinned: n.pinned, color: n.color }),
    });
    Object.assign(n, saved);
    state.stale = false;
    $("saveState").textContent = "Saved ✓";
    upsertLocal(saved);
    renderBoard();
  } catch (e) {
    $("saveState").textContent = "Save failed";
    toast("Could not save: " + e.message);
  } finally {
    state.saving = false;
  }
}

async function deleteCurrent() {
  const n = state.editing;
  if (!n) return;
  if (!confirm("Delete this note? It disappears on your phone at the next sync too.")) return;
  try {
    await api(`/api/notes/${encodeURIComponent(n.id)}/delete`, { method: "POST" });
    state.notes = state.notes.filter((x) => x.id !== n.id);
    closeEditor(false);
    renderBoard();
    toast("Note deleted");
  } catch (e) {
    toast("Delete failed: " + e.message);
  }
}

function upsertLocal(saved) {
  const i = state.notes.findIndex((n) => n.id === saved.id);
  if (i >= 0) state.notes[i] = saved; else state.notes.unshift(saved);
  state.notes.sort((a, b) => (a.pinned === b.pinned) ? b.updated - a.updated : (a.pinned ? -1 : 1));
}

/* When a poll brings a newer version of the open note: follow along unless
   the user is mid-edit, in which case offer a reload. */
function reconcileEditor() {
  const n = state.editing;
  if (!n) return;
  const fresh = state.notes.find((x) => x.id === n.id);
  if (!fresh) return;
  const userEdited =
    $("editTitle").value !== n.title || $("editBody").value !== n.body;
  if (fresh.updated > n.updated) {
    if (userEdited || state.saving) {
      state.stale = true;
    } else {
      Object.assign(n, fresh);
      $("editTitle").value = fresh.title;
      $("editBody").value = fresh.body;
    }
  }
  renderEditorChrome();
}

/* ---------- chip ---------- */

function renderChip() {
  const s = state.status;
  const last = Math.max(s.last_pull || 0, s.last_push || 0);
  $("chip").classList.toggle("err", !!s.last_error);
  $("chipText").textContent = s.last_error
    ? "Sync error"
    : (last ? "Synced " + clockTime(last) : "Connected");
}

/* ---------- theme ---------- */

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("nl-theme", theme);
}
applyTheme(localStorage.getItem("nl-theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

/* ---------- events ---------- */

$("newBtn").addEventListener("click", async () => {
  try {
    const note = await api("/api/notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    upsertLocal(note);
    renderBoard();
    openEditor({ ...note });
  } catch (e) {
    toast("Could not create note: " + e.message);
  }
});

$("search").addEventListener("input", (e) => {
  state.query = e.target.value;
  renderBoard();
});

$("themeBtn").addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

$("closeBtn").addEventListener("click", () => closeEditor());
$("overlay").addEventListener("click", () => closeEditor());
$("deleteBtn").addEventListener("click", deleteCurrent);
$("chip").addEventListener("click", syncNow);
$("reloadLink").addEventListener("click", (e) => {
  e.preventDefault();
  state.stale = false;
  reconcileEditor();
});

$("editTitle").addEventListener("input", scheduleSave);
$("editBody").addEventListener("input", scheduleSave);

$("pinBtn").addEventListener("click", () => {
  state.editing.pinned = !state.editing.pinned;
  renderEditorChrome();
  saveNow();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.editing) closeEditor();
  if ((e.ctrlKey || e.metaKey) && e.key === "s" && state.editing) {
    e.preventDefault();
    saveNow();
  }
});

/* ---------- polling ---------- */

load();
setInterval(load, 5000);

/* Safety sweep: flush to the hub every few seconds even while typing
   continuously, and again when the tab closes — the change stays committed
   in the local repo if the PC is offline, and pushes once it's back. */
setInterval(() => {
  if (state.editing && draftChanged()) saveNow();
}, 4000);

window.addEventListener("beforeunload", () => {
  const n = state.editing;
  if (!n || !draftChanged()) return;
  n.title = $("editTitle").value;
  n.body = $("editBody").value;
  navigator.sendBeacon(
    `/api/notes/${encodeURIComponent(n.id)}`,
    new Blob([JSON.stringify({ title: n.title, body: n.body, pinned: n.pinned, color: n.color })],
      { type: "application/json" })
  );
});
</script>
</body>
</html>
